research_questions:
  - "Has TradingView introduced a supported machine-readable drawing/layout API/export?"
  - "Can a supported UI/browser workflow retrieve exact Coordinates values without brittle DOM/private-state scraping?"
  - "Can screenshot + vision propose candidate geometry with operator confirmation at acceptable error rates?"
  - "Which drawing types can be represented exactly enough locally: horizontal, Fib, trendline, channel, rectangle, annotations?"
