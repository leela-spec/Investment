  - "credential/session-cookie extraction"
  - "unsupervised screenshot-to-live-alert activation"
  - "claiming exact numeric geometry from visually ambiguous screenshots"
research_method:
  - "Official-doc scan first."
  - "Small bounded POC on synthetic chart with known coordinates."
  - "Measure extraction error against known ground truth."
  - "Require operator confirmation before any candidate becomes active."
  - "Recommend IMPLEMENT only if supported, reproducible, and lower-effort than manual coordinate entry."
output: "A research report only; M90 is not part of production implementation acceptance."
