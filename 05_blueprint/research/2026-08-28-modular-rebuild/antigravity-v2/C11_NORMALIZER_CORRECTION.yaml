schema_version: "1.0"
correction_id: "C11"
repairs_module: "M11"
title: "Portfolio normalizer accounting and reconciliation correction"
status: "READY"
objective: "Repair canonical transaction accounting so reconciliation is independently derived rather than hardcoded and buy/sell/dividend cash semantics are correct."
keep:
  - "Canonical schema concept"
  - "source SHA-256/source_row_id lineage"
  - "CLI shape"
  - "explicit validation failures"
reject_or_fix:
  - "reconciliation_difference hardcoded to 0.0"
  - "gross values summed without transaction-sign semantics"
  - "sell handling that changes quantity without defensible cost-basis treatment"
  - "state claiming real broker adapter completion when real export is unavailable"
real_target_proof:
  target: "Deterministic accounting normalization"
  independent_oracle: "Fixed source-ledger totals and manually specified expected canonical balances independent of implementation functions"
steps:
  - "Read M11 authority and C11 only; inspect existing code and fixtures."
  - "Create TARGET_PROOF.md defining cash-sign convention, holdings-cost-basis convention, and independent source totals before code changes."
  - "Create a golden ledger fixture with explicit manually written expected cash movement, quantities, fees, taxes, dividends, and remaining cost basis. Do not generate expected values with PortfolioNormalizer."
  - "Define transaction sign semantics explicitly: buys/outflows, sells/inflows, dividends/inflows, fees/taxes/outflows, deposits/withdrawals."
  - "Choose and document the initial cost-basis method needed for current portfolio representation; if broker source does not permit valid cost-basis reconstruction, preserve broker-provided basis or mark UNKNOWN rather than fabricate."
  - "Compute reconciliation difference by comparing independently derived source totals with normalized totals. Never assign BALANCED unconditionally."
  - "Add mismatch fixture that MUST produce non-zero difference/FAIL."
  - "Keep real ZERO/Smartbroker adapters explicitly DEFERRED/BLOCKED until representative exports exist."
  - "Run CLI normalize/validate/reconcile twice and compare deterministic hashes."
  - "Invoke ipos-proof-verifier."
pass_conditions:
  - "A deliberately inconsistent fixture fails reconciliation."
  - "Expected ledger balances are fixed independently of code under test."
  - "Cash signs and remaining positions match the independent ledger."
  - "No silent drops."
  - "Real broker coverage status is truthful."
  - "Verifier verdict PASS or approved PASS_WITH_LIMITATIONS only for absent real broker exports."
stop_conditions:
  - "A broker-specific accounting rule is needed but no representative broker export/documentation exists; leave that adapter blocked."
