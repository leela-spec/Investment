value_target: >-
  Turn approved real research sources into evidence-linked NO_IMPACT, WATCH, REVIEW, or
  HIGH_PRIORITY_REVIEW outcomes without automatic trading or LLM arithmetic.

operating_model:
  authority: Repository files are canonical; chat memory is disposable.
  orchestrator: Select and sequence bounded outcomes, then accept or reject evidence; do not implement product changes.
  executor: Deliver one independently verifiable outcome within the active packet.
  openproject: Show ownership and status with repository links; do not duplicate technical context.

