context_policy:
  load_all_authorities: false
  rule: Read only the active packet and authority paths explicitly cited by it.
  checkpoint_rule: Persist decisions, evidence, deviations, and next actions; never persist chat transcripts or internal reasoning.
  history_only:
    - .agents/orchestrator_1/
    - C:/GitDev/apexai-os-meta/apex-meta/AI-Snippets/Inbetween_Delete/Chathistory.md

worktree_policy:
  observed_dirty: true
  rule: Preserve every path outside the active packet's allowed_paths; do not treat uncommitted work as accepted truth.
  unreviewed_existing_work:
    - path: ipos/etl/karakeep.py
      disposition: Preserve without extension; RI-11 decides whether Karakeep remains relevant.
    - path: ipos/export/telegram.py
      disposition: Preserve; reconcile only in a future Telegram implementation packet.
    - path: implementation-runs/WF07-KARAKEEP-TELEGRAM/
      disposition: Preserve as unreviewed execution evidence until a bounded review packet accepts or rejects it.
    - path: .env.example
      disposition: Preserve the existing modification; RI-01 must not alter it.

invariants:
  - Code computes every numeric value; LLMs only classify or narrate.
  - Core Python and DuckDB run natively on Windows 11 NTFS.
  - Supporting containers use the single Apex WSL2 Docker engine and native ext4 storage.
  - Wealthfolio remains a Windows desktop GUI with manual CSV synchronization.
  - Broker execution remains manual and operator-controlled.
  - No new framework, unrelated refactor, or additional documentation unless required by the active packet.
  - Stop when the packet acceptance criteria pass.

required_preflight:
  command: uv run python 06_modular_pipeline_alignment/audit/verify_reality_battery.py
  expected: 5 PASSED, 0 FAILED

