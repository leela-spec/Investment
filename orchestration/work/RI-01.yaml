schema_version: 1
id: RI-01
title: Confirm source mandate and fixture pack
status: stopped_pending_operator_source_mandate

product_value: >-
  Define exactly which research deserves attention so later automation creates a focused investment
  queue rather than scanning whole mailboxes or the public web.

practitioner_output: >-
  One approved, machine-readable source registry with a reason for inclusion, priority, lookback,
  detection method, and representative positive and negative samples for each source class.

authority_refs:
  - path: HANDOVER_RESEARCH_INTAKE_BOOTSTRAP.md
    sections:
      - 3. What the Operator Ultimately Receives
      - 4. The Process, Its Outputs, and Practitioner Value / Stage A
      - 5. Reuse the Existing Proven Sources as Acceptance Fixtures
      - 6. Minimal Initial Source Mandate for the Operator
      - 7. Execution Order and Acceptance Value / RI-01
  - path: 05_blueprint/research/2026-08-28-modular-rebuild/08_USER_STORIES_AND_INTEGRATION_WORKFLOWS.md
    sections:
      - US-EMAIL-01
      - US-EMAIL-02
      - US-EMAIL-03
      - US-VIDEO-01
      - US-EVIDENCE-01
      - US-HEALTH-01

operator_inputs:
  web_de:
    required:
      - approved senders or domains
      - target folder name
      - one relevant EML example or stable local path
      - one irrelevant EML example or stable local path
  gmail:
    required:
      - approved senders or domains
      - target label name
      - one relevant message example or stable reference
      - one duplicate or forwarded-message example or stable reference
  youtube:
    required:
      - three to five channel URLs
      - optional playlists
      - topic or keyword filters
      - approved lookback period
  websites:
    required:
      - three to five public sites or section URLs
      - RSS or Atom URL when known
      - login or paywall status
  manual:
    required:
      - one or two representative PDFs with publisher or source URL
      - one or two one-off article bookmarks

