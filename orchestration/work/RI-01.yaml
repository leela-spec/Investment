outputs:
  source_registry: configs/research_sources.yaml
  updated_packet: orchestration/work/RI-01.yaml
  updated_state: orchestration/state.yaml

allowed_paths:
  - configs/research_sources.yaml
  - orchestration/work/RI-01.yaml
  - orchestration/state.yaml
  - PROJECT_STATE.md

forbidden_scope:
  - Deploying or configuring Karakeep
  - Deploying or configuring Activepieces
  - Connecting email credentials
  - Implementing Karakeep or Telegram code
  - Reading whole mailboxes or unrestricted websites
  - Adding a new framework, database, dashboard, or generalized test harness
  - Changing portfolio arithmetic, scoring, allocation, or order logic

acceptance:
  - Every approved source has an owner, source class, stable identifier, reason, topics, priority, lookback, and detection method.
  - Email sources identify bounded folders or labels rather than whole-mailbox scanning.
  - Every source class has a positive sample and a negative, duplicate, or irrelevant sample where applicable.
  - The five existing media fixtures are verified by stable path and remain read-only.
  - No password, OAuth token, API key, bot token, or mailbox credential is written to Git or chat.
  - The registry is valid YAML and contains no unresolved placeholders.

stop_when:
  - The operator has not yet selected or approved a source.
  - A requested source requires paywall bypassing, unrestricted mailbox access, or prohibited scraping.
  - A fixture path is missing or its identity contradicts the committed evidence.
  - Completing the packet would require service deployment or product-code changes.

checkpoint_policy:
  record:
    - approved decisions
    - stable sample paths or external identifiers
    - validation evidence
    - deviations and next action
  omit:
    - chat transcript
    - internal reasoning
    - routine command logs
    - speculative future sources

result:
  state: pending_operator_inputs
  source_registry: null
  verified_fixtures: []
  deviations: []
  next_action: Ask the operator for the bounded source information listed in operator_inputs; do not request secrets.
