schema_version: 1
id: RI-05
title: Automate approved YouTube discovery and media handoff
status: blocked

product_value: >-
  Detect new research from approved YouTube sources without browsing arbitrary channels, preserve
  each source once, and hand relevant media to the already proven transcript and evidence workflow.

practitioner_output: >-
  A bounded YouTube source configuration with deterministic discovery, deduplication, custody,
  media-pipeline handoff, and a reviewable transcript/evidence receipt for the accepted fixture.

executor_instruction: >-
  Configure and prove only approved YouTube channel or playlist discovery and its handoff to the
  existing M08/M09 workflow. Reuse the committed IMF and four-source fixtures; do not rebuild the
  downloader, transcription system, or transcript-to-knowledge architecture. Do not bypass private,
  paid, age-restricted, or otherwise unsupported access controls.

startup_instructions:
  working_directory: C:/GitDev/Investment
  commands:
    - git branch --show-current
    - git status --short
    - uv run python 06_modular_pipeline_alignment/audit/verify_reality_battery.py
  read_first:
    - PROJECT_STATE.md
    - orchestration/state.yaml
    - orchestration/work/RI-05.yaml
  then_read_only:
    - path: HANDOVER_RESEARCH_INTAKE_BOOTSTRAP.md
      sections:
        - 5. Reuse the Existing Proven Sources as Acceptance Fixtures
        - 6. Minimal Initial Source Mandate for the Operator / YOUTUBE
        - 7. Execution Order and Acceptance Value / RI-05
    - path: 05_blueprint/research/2026-08-28-modular-rebuild/implementation-plans/M08_MEDIA_PIPELINE.yaml
      sections: [entire bounded module plan]
    - path: 05_blueprint/research/2026-08-28-modular-rebuild/implementation-plans/M09_TRANSCRIPT_TO_KNOWLEDGE.yaml
      sections: [entire bounded module plan]
    - path: 05_blueprint/research/2026-08-28-modular-rebuild/08_USER_STORIES_AND_INTEGRATION_WORKFLOWS.md
      sections: [US-VIDEO-01, US-VIDEO-02, US-KB-01, US-HEALTH-01]
  dependency_gate: >-
    Confirm RI-01 and RI-02 are accepted. Confirm the five fixture paths exist and remain read-only.
    Stop if an identity conflicts with committed evidence.
  execution_start: >-
    Register one approved public channel feed or playlist source in Karakeep, prove one discovery and
    one duplicate suppression, then hand the existing IMF fixture through the accepted M08/M09 boundary.

