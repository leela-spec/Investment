allowed_repo_paths:
  - implementation-runs/RI-05/
  - orchestration/work/RI-05.yaml
  - orchestration/state.yaml
  - PROJECT_STATE.md

allowed_external_changes:
  - Approved YouTube RSS or playlist discovery configuration in Karakeep
  - Karakeep test records for approved public fixtures
  - Non-secret execution receipts and flow exports

forbidden_scope:
  - Arbitrary YouTube search or unrestricted channel crawling
  - Rewriting M08 or M09
  - Modifying or duplicating source-of-record fixture directories
  - Access-control bypass, cookie theft, or private-source downloading
  - Treating ASR output as verified numeric fact
  - Autonomous portfolio or broker action

acceptance:
  - Required preflight reports 5 PASSED and 0 FAILED.
  - Discovery is limited to approved channel or playlist identifiers and approved lookback.
  - One new public item creates exactly one stable Karakeep record.
  - Reprocessing the same item creates no second canonical record.
  - The IMF fixture retains source identity, hashes, timestamps, and raw ASR limitations.
  - M08 handoff produces or references an evidence-ready transcript and frame manifest.
  - M09 handoff preserves quote-to-timestamp traceability without architecture changes.
  - The non-investment fixture can resolve to NO_IMPACT without forced portfolio relevance.
  - Unsupported or private media produces an explicit SYSTEM failure and no bypass attempt.

stop_when:
  - A dependency is incomplete.
  - No approved public channel or playlist is recorded in the source registry.
  - A fixture path is missing or its identity conflicts with committed evidence.
  - Current official media-tool behavior materially contradicts M08.
  - Completion would require rebuilding the media or knowledge pipeline.

