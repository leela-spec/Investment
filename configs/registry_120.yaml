# IPOS Long-Term Mega-System Expansion - 120-indicator registry.
#
# Expands configs/registry.yaml (golden-20 walking skeleton) to 120 indicators
# across Equity, Rates, Credit, FX, Commodities, CFTC COT positioning
# (commercial / speculator net longs), ISM subindices and global liquidity.
#
# SCHEMA: identical to configs/registry.yaml and validated against the pydantic
# models in ipos/config/models.py (RegistryEntry: extra='forbid'). Load with:
#   from pathlib import Path
#   from ipos.config.load import load_registry
#   reg = load_registry(Path('configs'))   # after swapping registry.yaml, or a temp dir
#
# CONVENTIONS (inherited from the golden-20 file):
# * `higher_is_better` is relative to risk-on / macro-supportive.
# * scoring_method: percentile (rank in trailing window), zscore (tanh-damped),
#   band (explicit thresholds; directionality encoded IN the band scores).
# * Curve bands follow rules.jsonl convention: <0 -> 20 ... >=1.0 -> 90.
# * `needs_verification: true` marks source codes not yet confirmed live;
#   run ipos-doctor before treating them as critical. NEVER let --seed-offline
#   fill missing rows for any series here (see the HY_OAS history-cap audit in
#   configs/registry.yaml).
# * COT series are wired as manual_csv drops from the free CFTC API until a
#   native connector exists; ISM subindices use their official FRED codes.

