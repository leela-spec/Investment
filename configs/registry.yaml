# IPOS indicator registry — the single source of truth (registry-driven; D2->D3).
# Golden-20 walking-skeleton set: 12 FRED (one key) + 8 Stooq (no key).
# `higher_is_better` is relative to "risk-on / supportive".
# `sources` is an ordered fallback chain (C2). `extract_ref` is provenance
# back to 03_extract/indicators.jsonl. Band scores encode directionality
# directly (the band table IS the mapping), so band indicators do not invert.
#
# Curve bands seed from rules.jsonl (<0 -> 20 ... >=1.0 -> 90).
#
# ---------------------------------------------------------------------------
# SOURCE-AVAILABILITY AUDIT, 2026-07-27 (all claims below were tested live)
#
# 1. DBnomics dropped FRED as a provider. Its API lists 93 providers and FRED
#    is not among them, so every `{type: dbnomics, locator: FRED/...}` leg was
#    dead — 15 of them, one per FRED series. They have been REMOVED rather than
#    left in place: a fallback that cannot work is worse than no fallback,
#    because it hides the fact that a series is single-sourced. Re-add them if
#    FRED ever returns to DBnomics.
#
# 2. Stooq was returning an HTML block page (not CSV) for every symbol tested,
#    so the eight market series were being carried entirely by their Yahoo leg.
#    Stooq entries are KEPT — unlike the DBnomics change this looks like a
#    transient block/rate-limit, not a structural removal — but do not assume
#    Stooq is live. `ipos-doctor` and the run's stale flags will show it.
#
# 3. Yahoo history depth was self-inflicted, not a source limit: the connector
#    defaulted to `range=5y`. It now requests explicit dates and reaches back
#    decades (SPX 1985, DAX/RUT 1987, US10Y 1985, GOLD/COPPER 2000, EURUSD
#    2003) at true DAILY granularity. NB `range=max` must never be used — it
#    silently returns QUARTERLY bars.
#
# 4. Genuinely single-source (FRED-only) after the cleanup, because no free
#    equivalent exists: T10Y2Y, T10Y3M, NFCI, DTWEXBGS, WALCL, WRESBAL, ICSA,
#    UMCSENT, DFF, HY_OAS, IG_OAS. Their only backstop is the local archive
#    replay. Notes: DTWEXBGS has no substitute (the Fed's broad trade-weighted
#    index is NOT the ICE dollar index DXY — 120.5 vs 101.4 on the same day);
#    T10Y2Y/T10Y3M could in principle be derived from the ustreasury tenors.
# ---------------------------------------------------------------------------

indicators:
  # ---- 12 FRED ----
  - series_id: T10Y2Y
    name: "10y-2y Treasury curve"
    asset_class: Rates
    frequency: D
    unit: pct
    sources:
      - {type: fred, locator: T10Y2Y}
      # Official keyless second leg, required because this series is `critical`
      # and FRED became its only source when FRED left DBnomics (2026-07-27).
      # The Treasury publishes the tenors; the connector differences them.
      # Verified same-day against FRED: +0.360 vs 0.36.
      - {type: ustreasury, locator: "BC_10YEAR-BC_2YEAR"}
    higher_is_better: true
    scoring_method: band
    scoring_params:
      bands:
        - {upper: 0.0, score: 20}    # x < 0  (inverted)
        - {upper: 0.5, score: 45}    # [0, 0.5)
        - {upper: 1.0, score: 70}    # [0.5, 1.0)
        - {upper: null, score: 90}   # >= 1.0
    module_id: GrowthRisk
    critical: true
    extract_ref: rates_yield_curve_us_10y_minus_2y_t10y2y

  - series_id: T10Y3M
    name: "10y-3m Treasury curve"
    asset_class: Rates
    frequency: D
    unit: pct
    sources:
      - {type: fred, locator: T10Y3M}
      - {type: ustreasury, locator: "BC_10YEAR-BC_3MONTH"}  # verified: +0.730 vs FRED 0.73
    higher_is_better: true
    scoring_method: band
    scoring_params:
      bands:
        - {upper: 0.0, score: 20}
        - {upper: 0.5, score: 45}
        - {upper: 1.0, score: 70}
        - {upper: null, score: 90}
    module_id: GrowthRisk
    extract_ref: rates_yield_curve_us_10y_minus_3m

  - series_id: DGS10
    name: "10y Treasury yield"
    asset_class: Rates
    frequency: D
    unit: pct
    sources:
      - {type: fred, locator: DGS10}
      - {type: ustreasury, locator: BC_10YEAR}
    higher_is_better: false
    scoring_method: zscore
    module_id: RatesLiquidity

  - series_id: NFCI
    name: "Chicago Fed National Financial Conditions Index"
    asset_class: Rates
    frequency: W
    unit: index
    sources:
      - {type: fred, locator: NFCI}
    higher_is_better: false   # negative = loose = supportive
    scoring_method: zscore
    module_id: RatesLiquidity

  - series_id: DTWEXBGS
    name: "Trade-weighted USD (broad)"
    asset_class: FX
    frequency: D
    unit: index
    sources:
      - {type: fred, locator: DTWEXBGS}
    higher_is_better: false   # strong USD = risk-off
    scoring_method: percentile
    module_id: FX

  - series_id: HY_OAS
    name: "US High Yield OAS"
    asset_class: Credit
    frequency: D
    unit: pct
    sources:
      # HISTORY CAP — 3 years, and it is not recoverable free. Exhaustively
      # checked 2026-07-27:
      #   * FRED's own note: "Starting in April 2026, this series will only
      #     include 3 years of observations. For more data, go to the source."
      #     observation_start is now 2023-07-28.
      #   * ALFRED vintages do NOT escape it — vintages 2024-01/2025-06/2026-01
      #     all return the same truncated window (history was purged, not just
      #     re-dated).
      #   * The truncation is universal across ICE BofA series (checked
      #     BAMLC0A0CM, BAMLH0A1HYBB, BAMLH0A3HYC, BAMLH0A0HYM2EY — all start
      #     2023-07-28), so no sibling index can stand in.
      #   * DBnomics is gone as a route: FRED is no longer a DBnomics provider.
      #   * Remaining free routes are aggregator sites (TradingEconomics,
      #     Equibles) which need keys or scraping — not wired deliberately.
      # So: 3 years is the honest free cap. Percentile scoring uses a 156-week
      # (~3y) window, so it still just fits. Drop a manual_csv export in if you
      # ever obtain longer history. NEVER let --seed-offline fill the gap —
      # that produced the synthetic rows purged 2026-07-27.
      - {type: fred, locator: BAMLH0A0HYM2}
      - {type: manual_csv, locator: "hy_oas*.csv"}
    higher_is_better: false
    scoring_method: percentile
    module_id: Credit
    critical: true
    playbook_refs: [SENTIMENT_POSITIONING]

  - series_id: IG_OAS
    name: "US Investment Grade OAS"
    asset_class: Credit
    frequency: D
    unit: pct
    sources:
      # Same 3-year cap as HY_OAS above — see its comment for the full audit.
      - {type: fred, locator: BAMLC0A0CM}
      - {type: manual_csv, locator: "ig_oas*.csv"}
    higher_is_better: false
    scoring_method: percentile
    module_id: Credit

  - series_id: VIXCLS
    name: "CBOE VIX"
    asset_class: Equity
    frequency: D
    unit: index
    sources:
      - {type: fred, locator: VIXCLS}
      - {type: stooq, locator: "^vix"}
      - {type: yahoo, locator: "^VIX"}     # verified 2026-07-27: daily from 1990-01-02, matches VIXCLS
    higher_is_better: false
    scoring_method: percentile
    module_id: EquityRisk

  - series_id: WALCL
    name: "Fed balance sheet (total assets)"
    asset_class: Liquidity
    frequency: W
    unit: usd_millions
    sources:
      - {type: fred, locator: WALCL}
    higher_is_better: true    # QE/QT proxy
    scoring_method: zscore
    module_id: Liquidity
    extract_ref: liquidity_fed_balance_sheet_total_assets_walcl

  - series_id: UMCSENT
    name: "UMich consumer sentiment"
    asset_class: Equity
    frequency: M
    unit: index
    sources:
      - {type: fred, locator: UMCSENT}
    higher_is_better: true
    scoring_method: percentile
    module_id: Fundamentals
    extract_ref: macro_consumer_sentiment_university_of_michigan

  - series_id: WTI
    name: "WTI crude oil"
    asset_class: Commodities
    frequency: D
    unit: usd
    sources:
      - {type: fred, locator: DCOILWTICO}
      - {type: stooq, locator: "cl.f"}
      # front-month futures, not the DCOILWTICO spot series: a small basis, so
      # it is the LAST leg — a degraded-but-real price beats no price.
      - {type: yahoo, locator: "CL=F"}     # verified 2026-07-27: daily from 2000-08-23
    higher_is_better: true
    scoring_method: percentile
    module_id: Commodities

  - series_id: DFF
    name: "Effective Fed Funds rate"
    asset_class: Rates
    frequency: D
    unit: pct
    sources:
      - {type: fred, locator: DFF}
    higher_is_better: false   # policy tightness
    scoring_method: zscore
    module_id: RatesLiquidity

  # thin-module widening (WS-E): a 2nd real keyless member each for Liquidity
  # and Fundamentals, so no active module rides on a single indicator.
  - series_id: WRESBAL
    name: "Reserve balances at the Fed"
    asset_class: Liquidity
    frequency: W
    unit: usd_millions
    sources:
      - {type: fred, locator: WRESBAL}
    higher_is_better: true    # more reserves = looser
    scoring_method: zscore
    module_id: Liquidity

  - series_id: ICSA
    name: "Initial jobless claims"
    asset_class: Macro
    frequency: W
    unit: count
    sources:
      - {type: fred, locator: ICSA}
    higher_is_better: false   # more claims = weaker labor = worse
    scoring_method: percentile
    module_id: Fundamentals

  # ---- 8 Stooq ----
  - series_id: SPX
    name: "S&P 500"
    asset_class: Equity
    frequency: D
    unit: index
    sources:
      - {type: stooq, locator: "^spx"}
      - {type: stooq, locator: "spy.us"}
      - {type: yahoo, locator: "^GSPC"}
    higher_is_better: true
    scoring_method: percentile
    module_id: EquityRisk
    critical: true
    playbook_refs: [MARKET_CONDITIONS]

  - series_id: NDX
    name: "Nasdaq 100"
    asset_class: Equity
    frequency: D
    unit: index
    sources:
      - {type: stooq, locator: "^ndx"}
      - {type: yahoo, locator: "^NDX"}
    higher_is_better: true
    scoring_method: percentile
    module_id: EquityRisk

  - series_id: RUT
    name: "Russell 2000"
    asset_class: Equity
    frequency: D
    unit: index
    sources:
      - {type: stooq, locator: "^rut"}
      - {type: yahoo, locator: "^RUT"}
    higher_is_better: true
    scoring_method: percentile
    module_id: EquityRisk

  - series_id: DAX
    name: "DAX"
    asset_class: Equity
    frequency: D
    unit: index
    sources:
      - {type: stooq, locator: "^dax"}
      - {type: yahoo, locator: "^GDAXI"}
    higher_is_better: true
    scoring_method: percentile
    module_id: EquityRisk

  - series_id: GOLD
    name: "Gold (spot)"
    asset_class: Commodities
    frequency: D
    unit: usd
    sources:
      - {type: stooq, locator: "xauusd"}
      - {type: yahoo, locator: "GC=F"}
    higher_is_better: true
    scoring_method: percentile
    module_id: Commodities

  - series_id: COPPER
    name: "Copper futures"
    asset_class: Commodities
    frequency: D
    unit: usd
    sources:
      - {type: stooq, locator: "hg.f"}
      - {type: yahoo, locator: "HG=F"}
    higher_is_better: true
    scoring_method: percentile
    module_id: Commodities
    needs_verification: true

  - series_id: EURUSD
    name: "EUR/USD"
    asset_class: FX
    frequency: D
    unit: rate
    sources:
      - {type: stooq, locator: "eurusd"}
      - {type: yahoo, locator: "EURUSD=X"}
    higher_is_better: true    # USD inverse cross-check
    scoring_method: percentile
    module_id: FX

  - series_id: US10Y_STOOQ
    name: "US 10y yield (market, Stooq)"
    asset_class: Rates
    frequency: D
    unit: pct
    sources:
      - {type: stooq, locator: "10usy.b"}
      - {type: yahoo, locator: "^TNX"}
    higher_is_better: false
    scoring_method: zscore
    module_id: RatesLiquidity
    needs_verification: true
