# Instrument -> IPOS module, for the Portfolio vs. Stance report section
# (05_blueprint/03_PORTFOLIO_MODULE.md). Operator-maintained, one-time setup
# + occasional additions, same philosophy as every other config in this repo
# (explicit, no auto-classification).
#
# Add a line whenever a new position is bought. Key is whatever identifier
# your broker export uses for `instrument` — for both of your brokers that is
# the ISIN, matched verbatim. Value is one of the module_ids in
# configs/modules.yaml.
#
# ---------------------------------------------------------------------------
# NOTE ON WHICH MODULES CAN EVER MATCH A HOLDING
# Only two of the eight modules describe things you can hold directly:
#   EquityRisk  (stance_dim: equity)      <- shares, equity derivatives
#   Commodities (stance_dim: commodities) <- gold, broad commodity funds
# The other six — RatesLiquidity, GrowthRisk, Credit, Liquidity, FX,
# Fundamentals — are macro *condition* modules built from the yield curve,
# credit spreads, central-bank balance sheets and survey data. They are
# signals, not asset buckets, so a share portfolio will normally light up
# EquityRisk and Commodities only. That is expected, not a gap: the useful
# read is "my equity weight vs. this week's equity tilt".
# They would only ever be used if you held bond funds (RatesLiquidity),
# credit/HY funds (Credit) or an FX position (FX).
# ---------------------------------------------------------------------------
#
# Populated 2026-07-27 from the operator's two real exports:
#   * finanzen.net Zero  — CSV (auto-ingested from data/inbox/portfolio*.csv)
#   * Smartbroker        — PDF "Depotübersicht" only; no CSV export exists for
#     this broker, so these rows take effect only if those positions reach a
#     CSV. Mapping them now costs nothing and makes that automatic later.

