# Contradictions engine predicates (C4 decision 5). Evaluated over the week's
# module/indicator scores + regime by a safe AST evaluator (no eval).
#
# DSL helpers: module('X'), module_conf('X'), module_spread('X'),
# indicator('Y'), regime(). Scores are 0-100 (higher = more risk-on/supportive
# for that module). Severity: low | med | high.
#
# Seeded from the Blueprint's canonical macro contradictions + the Playbook
# modules' "Contradictions to Watch" sections, restricted to the golden-20
# modules (EquityRisk, RatesLiquidity, GrowthRisk, Credit, Liquidity, FX,
# Commodities, Fundamentals). Regime-based predicates arrive with the Phase-2
# classifier; until then regime() is null and those simply don't fire.

contradictions:
  - id: EQ_vs_CREDIT
    severity: high
    summary: "Equities risk-on while credit spreads signal stress (stocks up, credit warning)."
    when: "module('EquityRisk') >= 70 and module('Credit') <= 40"

  - id: EQ_vs_RATES
    severity: med
    summary: "Equities risk-on while rates/liquidity conditions look tight."
    when: "module('EquityRisk') >= 70 and module('RatesLiquidity') <= 35"

  - id: EQ_vs_GROWTH
    severity: med
    summary: "Equities risk-on while the yield curve signals elevated recession risk."
    when: "module('EquityRisk') >= 70 and module('GrowthRisk') <= 30"

  - id: COMMODITIES_vs_GROWTH
    severity: low
    summary: "Cyclical commodities strong while the curve signals weak growth."
    when: "module('Commodities') >= 70 and module('GrowthRisk') <= 30"

  - id: LIQUIDITY_vs_CREDIT
    severity: med
    summary: "Central-bank liquidity supportive while credit spreads signal stress."
    when: "module('Liquidity') >= 65 and module('Credit') <= 35"

  - id: EQ_vs_FUNDAMENTALS
    severity: low
    summary: "Equities risk-on while consumer/macro fundamentals are weak."
    when: "module('EquityRisk') >= 70 and module('Fundamentals') <= 30"

  - id: BROAD_RISKON_CREDIT_LAG
    severity: high
    summary: "Broad risk-on (equities + commodities) but credit not confirming."
    when: "module('EquityRisk') >= 65 and module('Commodities') >= 60 and module('Credit') <= 45"

  # intra-module conflict (Blueprint "mixed signal"): members far apart
  - id: EQUITY_MIXED_SIGNAL
    severity: low
    summary: "Mixed signals within the equity-risk module (members strongly disagree)."
    when: "module_spread('EquityRisk') >= 60"

  - id: RATES_MIXED_SIGNAL
    severity: low
    summary: "Mixed signals within the rates/liquidity module (members strongly disagree)."
    when: "module_spread('RatesLiquidity') >= 60"

  # Portfolio vs. stance (05_blueprint/03_PORTFOLIO_MODULE.md §8 follow-up 2):
  # actual holdings disagreeing with this week's suggested tilt. Reuses
  # stance_alignment's own thresholds (weight_threshold=10.0, tilt_
  # threshold=0.2) from ipos/aggregate/portfolio.py so the rule agrees with
  # the report's own "aligned"/"headwind" language. portfolio_weight() is
  # null in any week with no portfolio CSV dropped, so these silently don't
  # fire in the common no-CSV case (fail-degraded, never a hard dependency).
  - id: PORTFOLIO_EQUITYRISK_MISMATCH
    severity: med
    summary: "Your EquityRisk portfolio weight and this week's suggested tilt disagree."
    when: "(portfolio_weight('EquityRisk') >= 10 and tilt('EquityRisk') <= -0.2) or (portfolio_weight('EquityRisk') < 10 and tilt('EquityRisk') >= 0.2)"

  - id: PORTFOLIO_RATESLIQUIDITY_MISMATCH
    severity: med
    summary: "Your RatesLiquidity portfolio weight and this week's suggested tilt disagree."
    when: "(portfolio_weight('RatesLiquidity') >= 10 and tilt('RatesLiquidity') <= -0.2) or (portfolio_weight('RatesLiquidity') < 10 and tilt('RatesLiquidity') >= 0.2)"

  - id: PORTFOLIO_GROWTHRISK_MISMATCH
    severity: med
    summary: "Your GrowthRisk portfolio weight and this week's suggested tilt disagree."
    when: "(portfolio_weight('GrowthRisk') >= 10 and tilt('GrowthRisk') <= -0.2) or (portfolio_weight('GrowthRisk') < 10 and tilt('GrowthRisk') >= 0.2)"

  - id: PORTFOLIO_CREDIT_MISMATCH
    severity: med
    summary: "Your Credit portfolio weight and this week's suggested tilt disagree."
    when: "(portfolio_weight('Credit') >= 10 and tilt('Credit') <= -0.2) or (portfolio_weight('Credit') < 10 and tilt('Credit') >= 0.2)"

  - id: PORTFOLIO_LIQUIDITY_MISMATCH
    severity: med
    summary: "Your Liquidity portfolio weight and this week's suggested tilt disagree."
    when: "(portfolio_weight('Liquidity') >= 10 and tilt('Liquidity') <= -0.2) or (portfolio_weight('Liquidity') < 10 and tilt('Liquidity') >= 0.2)"

  - id: PORTFOLIO_FX_MISMATCH
    severity: med
    summary: "Your FX portfolio weight and this week's suggested tilt disagree."
    when: "(portfolio_weight('FX') >= 10 and tilt('FX') <= -0.2) or (portfolio_weight('FX') < 10 and tilt('FX') >= 0.2)"

  - id: PORTFOLIO_COMMODITIES_MISMATCH
    severity: low
    summary: "Your Commodities portfolio weight and this week's suggested tilt disagree."
    when: "(portfolio_weight('Commodities') >= 10 and tilt('Commodities') <= -0.2) or (portfolio_weight('Commodities') < 10 and tilt('Commodities') >= 0.2)"

  - id: PORTFOLIO_FUNDAMENTALS_MISMATCH
    severity: low
    summary: "Your Fundamentals portfolio weight and this week's suggested tilt disagree."
    when: "(portfolio_weight('Fundamentals') >= 10 and tilt('Fundamentals') <= -0.2) or (portfolio_weight('Fundamentals') < 10 and tilt('Fundamentals') >= 0.2)"
